[package]
name = "metronome"
version = "0.1.0"
edition = "2021"
description = "A single-binary cron-style job scheduler with a pure, unit-tested schedule engine."
license = "MIT"

[lib]
name = "metronome"
path = "src/lib.rs"

[[bin]]
name = "metronome"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
